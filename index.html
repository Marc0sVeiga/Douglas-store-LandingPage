<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Douglas Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,400;1,500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/mobile-navigation.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/lookbook.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/content.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header" id="inicio">
      <div class="header-inner">
        <button
          class="menu-toggle"
          type="button"
          aria-label="Abrir menu"
          aria-expanded="false"
          aria-controls="mobile-navigation"
          data-menu-toggle
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <a class="brand" href="#inicio" aria-label="Douglas Store - início">
          <span class="brand-mark">
            <img src="public/logo.jpg" alt="" />
          </span>
          <span class="brand-copy">
            <span class="brand-name">Douglas Store</span>
            <span class="brand-location">Campo Grande - MS</span>
          </span>
        </a>

        <nav class="desktop-navigation" aria-label="Navegação principal">
          <ul class="navigation-list" data-navigation-list></ul>
        </nav>

        <a
          class="whatsapp-link desktop-whatsapp"
          href="https://wa.me/?text=Ol%C3%A1%2C%20Douglas%20Store!"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L0 24l6.5-1.7a11.8 11.8 0 0 0 5.6 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.5-8.4ZM12.1 21.7c-1.7 0-3.4-.5-4.8-1.3l-.4-.2-3.9 1 1-3.8-.2-.4a9.8 9.8 0 0 1-1.5-5.2c0-5.4 4.4-9.8 9.8-9.8 2.6 0 5.1 1 6.9 2.9a9.7 9.7 0 0 1 2.9 6.9c0 5.4-4.4 9.8-9.8 9.8Zm5.4-7.3c-.3-.2-1.7-.9-2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.2-.7l.5-.6.2-.5c.1-.2 0-.4 0-.6L9 6.8c-.2-.4-.4-.4-.7-.4h-.6c-.3 0-.6.1-.9.4s-1.1 1.1-1.1 2.7 1.2 3.1 1.4 3.4c.2.2 2.3 3.5 5.5 4.9.8.3 1.4.5 1.9.6.8.3 1.5.2 2 .1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z"
            ></path>
          </svg>
          <span>WhatsApp</span>
        </a>

        <a
          class="whatsapp-link mobile-whatsapp"
          href="https://wa.me/?text=Ol%C3%A1%2C%20Douglas%20Store!"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Falar com a Douglas Store pelo WhatsApp"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L0 24l6.5-1.7a11.8 11.8 0 0 0 5.6 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.5-8.4ZM12.1 21.7c-1.7 0-3.4-.5-4.8-1.3l-.4-.2-3.9 1 1-3.8-.2-.4a9.8 9.8 0 0 1-1.5-5.2c0-5.4 4.4-9.8 9.8-9.8 2.6 0 5.1 1 6.9 2.9a9.7 9.7 0 0 1 2.9 6.9c0 5.4-4.4 9.8-9.8 9.8Zm5.4-7.3c-.3-.2-1.7-.9-2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.2-.7l.5-.6.2-.5c.1-.2 0-.4 0-.6L9 6.8c-.2-.4-.4-.4-.7-.4h-.6c-.3 0-.6.1-.9.4s-1.1 1.1-1.1 2.7 1.2 3.1 1.4 3.4c.2.2 2.3 3.5 5.5 4.9.8.3 1.4.5 1.9.6.8.3 1.5.2 2 .1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z"
            ></path>
          </svg>
        </a>
      </div>

      <button
        class="menu-backdrop"
        type="button"
        aria-label="Fechar menu"
        data-menu-overlay
        hidden
      ></button>
      <aside
        class="mobile-drawer"
        id="mobile-navigation"
        aria-label="Menu de navegação"
        aria-modal="true"
        role="dialog"
        data-mobile-menu
        hidden
      >
        <div class="drawer-header">
          <a
            class="brand drawer-brand"
            href="#inicio"
            aria-label="Douglas Store - início"
          >
            <span class="brand-mark">
              <img src="public/logo.jpg" alt="" />
            </span>
            <span class="brand-copy">
              <span class="brand-name">Douglas Store</span>
              <span class="brand-location">Campo Grande - MS</span>
            </span>
          </a>
          <button
            class="drawer-close"
            type="button"
            aria-label="Fechar menu"
            data-menu-close
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <nav class="drawer-navigation" aria-label="Navegação mobile">
          <ul class="drawer-navigation-list" data-navigation-list></ul>
        </nav>

        <a
          class="whatsapp-link drawer-whatsapp"
          href="https://wa.me/?text=Ol%C3%A1%2C%20Douglas%20Store!"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L0 24l6.5-1.7a11.8 11.8 0 0 0 5.6 1.4h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.5-8.4ZM12.1 21.7c-1.7 0-3.4-.5-4.8-1.3l-.4-.2-3.9 1 1-3.8-.2-.4a9.8 9.8 0 0 1-1.5-5.2c0-5.4 4.4-9.8 9.8-9.8 2.6 0 5.1 1 6.9 2.9a9.7 9.7 0 0 1 2.9 6.9c0 5.4-4.4 9.8-9.8 9.8Zm5.4-7.3c-.3-.2-1.7-.9-2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.2-.7l.5-.6.2-.5c.1-.2 0-.4 0-.6L9 6.8c-.2-.4-.4-.4-.7-.4h-.6c-.3 0-.6.1-.9.4s-1.1 1.1-1.1 2.7 1.2 3.1 1.4 3.4c.2.2 2.3 3.5 5.5 4.9.8.3 1.4.5 1.9.6.8.3 1.5.2 2 .1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4Z"
            ></path>
          </svg>
          <span>WhatsApp</span>
        </a>
      </aside>
    </header>
    <noscript>
      <p>Ative o JavaScript para visualizar as coleções e os produtos da loja.</p>
    </noscript>
    <main>
      <section class="hero-section" aria-label="Hero da Douglas Store">
        <div class="hero-decor hero-decor--one" aria-hidden="true"></div>
        <div class="hero-decor hero-decor--two" aria-hidden="true"></div>
        <div class="hero-decor hero-decor--three" aria-hidden="true"></div>

        <fieldset class="hero-carousel">
          <legend class="visually-hidden">
            Escolha uma categoria da Douglas Store
          </legend>

          <div class="hero-inner">
            <div
              class="hero-panels"
              role="group"
              aria-label="Coleção selecionada"
              aria-live="polite"
              aria-roledescription="carrossel"
              data-hero-panels
            >
              <template data-hero-slide-template>
                <input
                  class="hero-slide-toggle"
                  type="radio"
                  name="hero-category"
                />
                <article class="hero-slide">
                  <div class="hero-copy">
                    <span class="hero-badge">
                      <span class="hero-badge-dot" aria-hidden="true"></span>
                      <span data-slide-badge></span>
                    </span>
                    <p class="hero-eyebrow" data-slide-eyebrow></p>
                    <h2 class="hero-title" data-slide-title></h2>
                    <p class="hero-description" data-slide-description></p>
                    <div class="hero-actions">
                      <a
                        class="btn btn-primary"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-slide-contact
                      ></a>
                      <a class="btn btn-secondary" href="#lookbook">
                        <span>VER NO LOOKBOOK</span>
                        <span aria-hidden="true" class="btn-arrow">↓</span>
                      </a>
                    </div>
                  </div>
                  <figure class="hero-figure">
                    <img data-slide-image />
                  </figure>
                </article>
              </template>
            </div>

            <div
              class="hero-controls"
              aria-label="Controles do carrossel"
              data-hero-controls
            ></div>
          </div>
        </fieldset>

        <div class="payment-strip" aria-label="Formas de pagamento aceitas">
          <ul>
            <li>
              <svg
                class="payment-icon payment-icon--visa"
                aria-hidden="true"
                viewBox="0 0 48 24"
              >
                <path
                  d="M4 2h40a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Z"
                  fill="#1434cb"
                ></path>
                <path
                  d="m11 6 5 12h3l5-12h-3.2l-3.2 8-3.3-8H11Z"
                  fill="#fff"
                ></path>
              </svg>
              <span>VISA</span>
            </li>
            <li>
              <svg
                class="payment-icon payment-icon--mastercard"
                aria-hidden="true"
                viewBox="0 0 40 24"
              >
                <circle cx="15" cy="12" r="9" fill="#eb001b"></circle>
                <circle cx="25" cy="12" r="9" fill="#f79e1b"></circle>
                <path
                  d="M20 4.5a9 9 0 0 1 0 15 9 9 0 0 1 0-15Z"
                  fill="#ff5f00"
                ></path>
              </svg>
              <span>Mastercard</span>
            </li>
            <li>
              <svg
                class="payment-icon payment-icon--elo"
                aria-hidden="true"
                viewBox="0 0 28 24"
              >
                <path
                  d="M5 5.5A10 10 0 0 1 22 7"
                  fill="none"
                  stroke="#00a4e0"
                  stroke-linecap="round"
                  stroke-width="3"
                ></path>
                <path
                  d="M23 10a10 10 0 0 1-4 10"
                  fill="none"
                  stroke="#f5a623"
                  stroke-linecap="round"
                  stroke-width="3"
                ></path>
                <path
                  d="M15 21a10 10 0 0 1-11-5"
                  fill="none"
                  stroke="#e53238"
                  stroke-linecap="round"
                  stroke-width="3"
                ></path>
                <circle cx="14" cy="12" r="3" fill="#161616"></circle>
              </svg>
              <span>ELO</span>
            </li>
            <li>
              <svg
                class="payment-icon payment-icon--pix"
                aria-hidden="true"
                viewBox="0 0 24 24"
              >
                <path
                  d="m12 2 4.2 4.2a3 3 0 0 0 2.1.9h1.2L12 12.6 4.5 7.1h1.2a3 3 0 0 0 2.1-.9L12 2Z"
                  fill="#32bcad"
                ></path>
                <path
                  d="m22 8.5-4.2 4.2a3 3 0 0 0-.9 2.1V16L11.4 8.5 17 1l.9 1.2a3 3 0 0 0 .9 2.1L22 8.5Z"
                  fill="#32bcad"
                  transform="rotate(90 16.7 8.5)"
                ></path>
                <path
                  d="m12 22-4.2-4.2a3 3 0 0 0-2.1-.9H4.5l7.5-5.5 7.5 5.5h-1.2a3 3 0 0 0-2.1.9L12 22Z"
                  fill="#32bcad"
                ></path>
                <path
                  d="m2 15.5 4.2-4.2a3 3 0 0 0 .9-2.1V8l5.5 7.5L7 23l-.9-1.2a3 3 0 0 0-.9-2.1L2 15.5Z"
                  fill="#32bcad"
                  transform="rotate(90 7.3 15.5)"
                ></path>
              </svg>
              <span>PIX</span>
            </li>
          </ul>
        </div>
      </section>

      <section
        class="lookbook-section"
        id="lookbook"
        aria-labelledby="lookbook-title"
      >
        <div class="lookbook-inner">
          <header class="lookbook-header">
            <h2 class="lookbook-title" id="lookbook-title">LOOKBOOK</h2>
            <p class="lookbook-subtitle">&amp; galeria visual autoral</p>
          </header>

          <ul
            class="lookbook-grid"
            aria-label="Galeria de produtos e looks"
            data-lookbook-grid
          ></ul>
        </div>
      </section>
    </main>
  </body>
</html>
